name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: "go.mod"
          cache-dependency-path: go.sum

      # Do not run `go mod tidy` here: it would mutate go.mod/go.sum after the
      # tagged commit, so the released binaries would not match what
      # `go install github.com/ipedrazas/a2@<version>` builds from the proxy.
      - name: Get dependencies
        run: |
          go mod download
          go mod verify

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run tests
        run: go test -v ./...

      - name: Build binaries
        env:
          VERSION: ${{ inputs.version }}
        run: |
          GITSHA=$(git rev-parse --short HEAD)
          BUILDDATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-s -w -X github.com/ipedrazas/a2/pkg/version.Version=${VERSION} -X github.com/ipedrazas/a2/pkg/version.GitSHA=${GITSHA} -X github.com/ipedrazas/a2/pkg/version.BuildDate=${BUILDDATE}"

          mkdir -p dist

          GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/a2-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/a2-linux-arm64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/a2-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags="${LDFLAGS}" -o dist/a2-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o dist/a2-windows-amd64.exe .

      - name: Create checksums
        run: |
          cd dist
          sha256sum a2-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.version }}
          name: Release ${{ inputs.version }}
          body: |
            ## Release ${{ inputs.version }}

            ### Binaries
            - `a2-linux-amd64` - Linux (amd64)
            - `a2-linux-arm64` - Linux (arm64)
            - `a2-darwin-amd64` - macOS (amd64)
            - `a2-darwin-arm64` - macOS (arm64)
            - `a2-windows-amd64.exe` - Windows (amd64)

            ### Install

            ```sh
            go install github.com/ipedrazas/a2@${{ inputs.version }}
            ```

            ### Checksums
            See `checksums.txt` for SHA256 checksums.
          files: |
            dist/a2-*
            dist/checksums.txt
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true

  verify-go-install:
    name: Verify go install
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "stable"

      # The proxy fetches the tag lazily, so the first request can 404 while
      # it is still indexing. Retry for a couple of minutes before failing.
      - name: Install from the module proxy
        env:
          VERSION: ${{ inputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if go install "github.com/ipedrazas/a2@${VERSION}"; then
              exit_code=0
              break
            fi
            exit_code=1
            echo "Attempt ${attempt} failed; the proxy may not have indexed ${VERSION} yet."
            sleep 30
          done
          test "${exit_code}" -eq 0

      - name: Check the installed binary reports the release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          "$(go env GOPATH)/bin/a2" version
          "$(go env GOPATH)/bin/a2" version | grep -q "Version:   ${VERSION}"
