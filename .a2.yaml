language:
  explicit: ["go"]           # Override auto-detect: ["go", "python"]
  go:
    coverage_threshold: 60

# Required files to check
files:
  required:
    - README.md
    - LICENSE
    - CONTRIBUTING.md

# Disable specific checks
checks:
  disabled:
    - go:logging  # Skip logging check
    - go:cyclomatic
    - common:health  # Skip health check
    - common:api_docs  # Skip api docs check
    - common:integration  # Skip integration check
    - common:metrics  # Skip metrics check
    - common:errors  # Skip errors check
    - common:license  # Skip license check
    - common:tracing  # Skip tracing check
    - common:migrations  # Skip migrations check
    - common:e2e  # Skip e2e tests check
    - common:config_validation  # Skip config validation check
    - common:retry  # Skip retry check
    - common:dockerfile  # Skip dockerfile check
    - devops:*  # Skip ansible check
    - security:shell_injection
    # - security:filesystem
    - security:network

# Execution options
execution:
  parallel: true  # Run checks in parallel (default: true). Set to false for CI with limited CPU.

# Custom external checks
external:
  - id: lint
    name: Golangci-lint
    command: golangci-lint
    args: ["run", "./..."]
    severity: warn
    speed: slow

  # Gosec runs inside golangci-lint (see .golangci.yml). The standalone gosec
  # binary (v2.29.0) cannot read Go 1.26 export data, so it analyses nothing
  # and fails on type-check errors; re-add it once a release supports Go 1.26.

  - id: go:errcheck
    name: Error Check
    command: errcheck
    args: ["-ignoretests", "./..."]
    severity: warn
    speed: slow

  - id: go:staticcheck
    name: Static Analysis
    command: staticcheck
    args: ["./..."]
    severity: warn
    speed: slow

  # - id: go:golicense
  #   name: Go License
  #   command: go-licenses
  #   args: ["check", "./...", "--ignore", "github.com/ipedrazas/a2", "./..."]
  #   severity: warn

security:
  obfuscation:
    allow:
      # n8n workflow fixtures: realistic export blobs (instance ids, fake keys)
      # that must survive as-is to exercise the n8n checks.
      - "pkg/n8n/testdata/**"
  filesystem:
    allow:
      - "pkg/checks/devops/k8s.go"
      - "pkg/checks/devops/k8s.go:os.ReadDir(chartsDir)"
      - "pkg/checks/common/**"
      - "pkg/config/**"
      - "pkg/safepath/**"
      - "pkg/utils/**"
      - "pkg/validator/**"
      - "pkg/**"
      - "ui/**"
      - "cmd/root.go"
      - "cmd/add.go"
